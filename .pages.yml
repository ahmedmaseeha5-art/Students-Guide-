media:
  input: media
  output: /media

content:
  - name: learning-material
    label: Learning Materials
    type: file
    path: resources.json
    format: json
    list: true
    fields:
      - name: title
        label: Lesson Title
        type: string
        required: true

      - name: subject
        label: Subject
        type: select
        options:
          values:
            - Fiqh
            - Aqaaid
            - Hadeeth
            - Islamic History
            - Surah Audios
            - Dua Audios

      - name: type
        label: Material Type
        type: select
        options:
          values:
            - note
            - surah
            - dua
            - audio

      - name: description
        label: Short Description
        type: text

      - name: notes
        label: Lesson Notes
        type: text

      - name: audioUrl
        label: Upload Audio
        type: file
        options:
          categories:
            - audio

      - name: keywords
        label: Search Keywords
        type: string
